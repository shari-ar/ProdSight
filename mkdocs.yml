site_name: ProdSight Technical Documentation
site_description: Technical documentation for the ProdSight offline factory production monitor
site_url: https://shari-ar.github.io/ProdSight
repo_url: https://github.com/shari-ar/ProdSight
repo_name: shari-ar/ProdSight
docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - content.code.copy

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Overview: overview.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Build & Packaging: build-and-run.md
  - Data Pipeline: data-handling.md
  - UI & Localization: ui-and-i18n.md
  - Testing & Quality: testing.md
  - Operations & Troubleshooting: troubleshooting.md
