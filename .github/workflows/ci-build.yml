name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create build .env from secrets
        env:
          PAGE_TITLE: ${{ secrets.PAGE_TITLE }}
          COMPANY_LOGO_BASE64: ${{ secrets.COMPANY_LOGO_BASE64 }}
          EXCEL_FILE_PATH: ${{ secrets.EXCEL_FILE_PATH }}
          ROWS_PER_PAGE: ${{ secrets.ROWS_PER_PAGE }}
          AUTO_REFRESH_INTERVAL_MS: ${{ secrets.AUTO_REFRESH_INTERVAL_MS }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          keys = [
              "PAGE_TITLE",
              "COMPANY_LOGO_BASE64",
              "EXCEL_FILE_PATH",
              "ROWS_PER_PAGE",
              "AUTO_REFRESH_INTERVAL_MS",
          ]

          env_path = Path(".env")
          with env_path.open("w", encoding="utf-8") as handle:
              for key in keys:
                  value = os.environ.get(key, "")
                  handle.write(f"{key}={value}\n")
          PY

      - name: Build single-file output
        run: npm run build
