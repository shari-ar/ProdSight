name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bump patch version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          npm version patch --no-git-tag-version
          new_version="$(node -p "require('./package.json').version")"
          echo "RELEASE_VERSION=v${new_version}" >> "$GITHUB_ENV"

      - name: Create build .env from secrets
        env:
          # Build-time configuration values are sourced from GitHub Actions secrets.
          PAGE_TITLE: ${{ secrets.PAGE_TITLE }}
          COMPANY_LOGO_SVG: ${{ secrets.COMPANY_LOGO_SVG }}
          EXCEL_FILE_PATH: ${{ secrets.EXCEL_FILE_PATH }}
          ROWS_PER_PAGE: ${{ secrets.ROWS_PER_PAGE }}
          AUTO_REFRESH_INTERVAL_MS: ${{ secrets.AUTO_REFRESH_INTERVAL_MS }}
        run: |
          set -euo pipefail

          # Required keys must be present to satisfy strict build-time validation.
          required_keys=(
            "PAGE_TITLE"
            "COMPANY_LOGO_SVG"
            "EXCEL_FILE_PATH"
            "ROWS_PER_PAGE"
            "AUTO_REFRESH_INTERVAL_MS"
          )

          # Fail fast when any required secret is missing.
          missing=()
          for key in "${required_keys[@]}"; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '[ERROR] Missing required CI secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          # Emit a deterministic .env containing only the expected keys.
          {
            printf 'PAGE_TITLE=%s\n' "$PAGE_TITLE"
            printf 'COMPANY_LOGO_SVG=%s\n' "$COMPANY_LOGO_SVG"
            printf 'EXCEL_FILE_PATH=%s\n' "$EXCEL_FILE_PATH"
            printf 'ROWS_PER_PAGE=%s\n' "$ROWS_PER_PAGE"
            printf 'AUTO_REFRESH_INTERVAL_MS=%s\n' "$AUTO_REFRESH_INTERVAL_MS"
          } > .env

      - name: Build single-file output
        run: npm run build

      - name: Commit version bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "ci: bump version to ${RELEASE_VERSION} [skip ci]"
          git tag "${RELEASE_VERSION}"
          git push origin HEAD:main --tags

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          # Make artifact names unique per workflow run to avoid collisions.
          name: prodsight-single-file-build-${{ github.run_number }}
          # Fail the workflow if expected build outputs are missing.
          if-no-files-found: error
          # Keep artifacts long enough for distribution without indefinite retention.
          retention-days: 30
          path: |
            # Publish the single-file offline build and its checksum manifest.
            dist/index.html
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          files: |
            dist/index.html
            dist/SHA256SUMS.txt
          generate_release_notes: true

      - name: Log published artifacts
        run: |
          echo "Published CI artifacts:"
          echo "  - dist/index.html"
          echo "  - dist/SHA256SUMS.txt"
          echo "Artifact name: prodsight-single-file-build-${{ github.run_number }}"
